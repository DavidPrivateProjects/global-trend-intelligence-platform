<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="760" viewBox="0 0 1320 760" role="img" aria-labelledby="title desc">
  <title id="title">Global Trend Intelligence Platform Medallion Architecture</title>
  <desc id="desc">A medallion architecture showing BigQuery public Google Trends sources flowing through bronze, silver, and gold dbt layers into dashboards, with Docker, Cloud Build, Artifact Registry, Cloud Run Jobs, Airflow, and Terraform around the data flow.</desc>
  <defs>
    <style>
      .title { font: 700 34px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 400 17px Arial, sans-serif; fill: #475569; }
      .box-title { font: 700 24px Arial, sans-serif; fill: #0f172a; }
      .box-text { font: 400 16px Arial, sans-serif; fill: #334155; }
      .small-title { font: 700 18px Arial, sans-serif; fill: #0f172a; }
      .small-text { font: 400 14px Arial, sans-serif; fill: #334155; }
      .arrow { stroke: #334155; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .dashed { stroke-dasharray: 8 8; }
    </style>
    <marker id="arrowhead" markerWidth="12" markerHeight="8" refX="11" refY="4" orient="auto">
      <polygon points="0 0, 12 4, 0 8" fill="#334155"/>
    </marker>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.14"/>
    </filter>
  </defs>

  <rect width="1320" height="760" fill="#f8fafc"/>

  <text x="660" y="58" text-anchor="middle" class="title">Global Trend Intelligence Platform</text>
  <text x="660" y="88" text-anchor="middle" class="subtitle">BigQuery-native medallion architecture with dbt, Cloud Run Jobs, Airflow-compatible orchestration, and Terraform-managed infrastructure</text>

  <rect x="50" y="152" width="210" height="160" rx="22" fill="#e0f2fe" stroke="#0284c7" stroke-width="2" filter="url(#shadow)"/>
  <text x="155" y="194" text-anchor="middle" class="box-title">Source</text>
  <text x="155" y="232" text-anchor="middle" class="box-text">BigQuery Public Data</text>
  <text x="155" y="258" text-anchor="middle" class="box-text">google_trends</text>
  <text x="155" y="286" text-anchor="middle" class="small-text">Native warehouse source</text>

  <rect x="330" y="135" width="230" height="195" rx="24" fill="#fef3c7" stroke="#d97706" stroke-width="2" filter="url(#shadow)"/>
  <text x="445" y="178" text-anchor="middle" class="box-title">Bronze</text>
  <text x="445" y="218" text-anchor="middle" class="box-text">Daily snapshots</text>
  <text x="445" y="246" text-anchor="middle" class="box-text">Explicit columns</text>
  <text x="445" y="274" text-anchor="middle" class="box-text">Cost controls</text>
  <text x="445" y="304" text-anchor="middle" class="small-text">Latest refresh_date per source</text>

  <rect x="630" y="135" width="230" height="195" rx="24" fill="#dcfce7" stroke="#16a34a" stroke-width="2" filter="url(#shadow)"/>
  <text x="745" y="178" text-anchor="middle" class="box-title">Silver</text>
  <text x="745" y="218" text-anchor="middle" class="box-text">Cleaned records</text>
  <text x="745" y="246" text-anchor="middle" class="box-text">Deduplicated grain</text>
  <text x="745" y="274" text-anchor="middle" class="box-text">SCD history</text>
  <text x="745" y="304" text-anchor="middle" class="small-text">SCD0 / SCD1 / SCD2 fields</text>

  <rect x="930" y="135" width="230" height="195" rx="24" fill="#ede9fe" stroke="#7c3aed" stroke-width="2" filter="url(#shadow)"/>
  <text x="1045" y="178" text-anchor="middle" class="box-title">Gold</text>
  <text x="1045" y="218" text-anchor="middle" class="box-text">Dimensions</text>
  <text x="1045" y="246" text-anchor="middle" class="box-text">Facts</text>
  <text x="1045" y="274" text-anchor="middle" class="box-text">Aggregates</text>
  <text x="1045" y="304" text-anchor="middle" class="small-text">Dashboard-ready marts</text>

  <rect x="1040" y="420" width="230" height="120" rx="20" fill="#fee2e2" stroke="#dc2626" stroke-width="2" filter="url(#shadow)"/>
  <text x="1155" y="462" text-anchor="middle" class="box-title">Dashboards</text>
  <text x="1155" y="500" text-anchor="middle" class="box-text">Looker Studio / BI</text>
  <text x="1155" y="524" text-anchor="middle" class="small-text">Trend intelligence insights</text>

  <path class="arrow" d="M260 232 L330 232"/>
  <path class="arrow" d="M560 232 L630 232"/>
  <path class="arrow" d="M860 232 L930 232"/>
  <path class="arrow" d="M1085 330 C1120 370, 1140 390, 1155 420"/>

  <rect x="75" y="445" width="260" height="135" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="205" y="486" text-anchor="middle" class="small-title">Runtime</text>
  <text x="205" y="520" text-anchor="middle" class="small-text">Docker image</text>
  <text x="205" y="544" text-anchor="middle" class="small-text">Cloud Run Job executes dbt build</text>

  <rect x="395" y="445" width="260" height="135" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="525" y="486" text-anchor="middle" class="small-title">Deployment</text>
  <text x="525" y="520" text-anchor="middle" class="small-text">Cloud Build</text>
  <text x="525" y="544" text-anchor="middle" class="small-text">Artifact Registry image</text>

  <rect x="715" y="445" width="260" height="135" rx="18" fill="#ffffff" stroke="#94a3b8" stroke-width="2"/>
  <text x="845" y="486" text-anchor="middle" class="small-title">Orchestration</text>
  <text x="845" y="520" text-anchor="middle" class="small-text">Airflow-compatible DAG</text>
  <text x="845" y="544" text-anchor="middle" class="small-text">Composer optional for production</text>

  <rect x="395" y="620" width="560" height="70" rx="18" fill="#e2e8f0" stroke="#64748b" stroke-width="2"/>
  <text x="675" y="648" text-anchor="middle" class="small-title">Terraform</text>
  <text x="675" y="674" text-anchor="middle" class="small-text">Provisions APIs, IAM, BigQuery dataset, Artifact Registry, Cloud Run Job, and orchestration service accounts</text>

  <path class="arrow dashed" d="M205 445 C260 385, 345 350, 445 330"/>
  <path class="arrow dashed" d="M525 445 C575 390, 660 355, 745 330"/>
  <path class="arrow dashed" d="M845 445 C900 390, 975 355, 1045 330"/>
  <path class="arrow dashed" d="M675 620 C675 570, 675 525, 525 580"/>
  <path class="arrow dashed" d="M675 620 C700 560, 760 535, 845 580"/>
</svg>
